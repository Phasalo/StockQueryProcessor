[project]
name = "stock-query-processor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3,<4",
    "openpyxl>=3.1.5,<4",
    "psycopg2>=2.9.13,<3",
    "pydantic>=2.14.3,<3",
    "pypika>=0.51.1,<0.52",
    "python-dotenv>=1.2.4,<2",
    "yandex-pgmigrate==1.0.13",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "RUF100", "C90", "TC", "TID", "S101"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"app/__init__.py" = ["E402"]
"**/{test_*,*_ut,*tests,*test}.py" = ["S101"]
